# Optional NVIDIA acceleration. Default deployment remains CPU compatible.
# docker compose -f docker-compose.yml -f compose.gpu.yml --profile controller up -d --build
services:
  ollama:
    gpus: all
    environment:
      OLLAMA_LLM_LIBRARY: ${OLLAMA_LLM_LIBRARY:-cuda_v12}
  controller:
    gpus: all
    build:
      args:
        GPU: '1'
    environment:
      WHISPER_DEVICE: auto
      OLLAMA_GPU_LAYERS: auto
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
  worker:
    gpus: all
    build:
      args:
        GPU: '1'
    environment:
      WHISPER_DEVICE: auto
      OLLAMA_GPU_LAYERS: auto
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
